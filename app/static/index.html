<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#4338ca">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>TransportPro</title>
  <link rel="manifest" href="/static/manifest.json">
  <link rel="icon" href="/static/icon.svg">
  <link rel="apple-touch-icon" href="/static/icon.svg">
  <link rel="stylesheet" href="/static/app.css?v={{V}}">
</head>
<body>
  <!-- Login -->
  <section id="loginView" class="login-wrap hidden">
    <div class="login-art">
      <div class="login-brand"><img src="/static/icon.svg" alt=""><span>TransportPro</span></div>
      <h1>Run your fleet<br>from your phone.</h1>
      <p>Trips, drivers, vehicles, servicing and payroll — in one simple app.</p>
    </div>
    <form id="loginForm" class="login-card" novalidate>
      <h2>Welcome back</h2>
      <p class="muted">Sign in to continue</p>
      <label>Username<input name="username" required minlength="3" autocomplete="username" autocapitalize="none" spellcheck="false"></label>
      <label>Password
        <div class="pw-wrap"><input name="password" type="password" required minlength="4" autocomplete="current-password">
          <button type="button" class="pw-eye" id="pwEye" aria-label="Show password">Show</button></div>
      </label>
      <div id="loginError" class="alert danger hidden"></div>
      <button class="btn primary block lg" type="submit">Sign in</button>
      <div class="demo">
        <span>Demo:</span>
        <button type="button" class="chip" data-demo="owner/owner123">Owner</button>
        <button type="button" class="chip" data-demo="admin/admin123">Admin</button>
        <button type="button" class="chip" data-demo="ramesh/driver123">Driver</button>
      </div>
    </form>
  </section>

  <!-- App shell -->
  <section id="appView" class="hidden">
    <header class="topbar">
      <button class="icon-btn only-mobile" id="menuBtn" aria-label="Menu"></button>
      <div class="brand"><img src="/static/icon.svg" alt=""><span>TransportPro</span></div>
      <div class="spacer"></div>
      <span id="offlineBadge" class="pill danger hidden">Offline</span>
      <a href="#/notifications" class="icon-btn bell" id="bellBtn" aria-label="Notifications"><span id="bellCount" class="bell-count hidden"></span></a>
      <a href="#/profile" class="avatar" id="avatar" title="Profile"></a>
    </header>
    <div id="enableBar" class="enable-bar hidden"></div>
    <nav id="sidebar" class="sidebar"></nav>
    <div id="backdrop" class="backdrop hidden"></div>
    <main id="page" class="page"></main>
    <button id="fab" class="fab hidden" aria-label="Add"></button>
    <nav id="bottomNav" class="bottom-nav"></nav>
  </section>

  <!-- Modal / bottom sheet -->
  <div id="modal" class="modal hidden" role="dialog" aria-modal="true">
    <div class="modal-card">
      <div class="sheet-handle"></div>
      <div class="modal-head"><h3 id="modalTitle"></h3><button class="icon-btn" id="modalClose" aria-label="Close"></button></div>
      <div id="modalBody" class="modal-body"></div>
    </div>
  </div>
  <div id="toast" class="toast hidden" role="status"></div>
  <div id="alerts" aria-live="assertive"></div>

  <script src="/static/app.js?v={{V}}"></script>
</body>
</html>
